<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Armel Sopgwi, full-cycle software engineer: build, lead, test">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#E6EDF3" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="45%" r="45%">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="track" gradientUnits="userSpaceOnUse" x1="770" y1="0" x2="1100" y2="0">
      <stop offset="0" stop-color="#F2CC60"/>
      <stop offset="0.35" stop-color="#58A6FF"/>
      <stop offset="0.68" stop-color="#3FB950"/>
      <stop offset="1" stop-color="#BC8CFF"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#0D1117"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
  </g>

  <!-- Identity -->
  <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="60" y="66" fill="#7D8590" font-size="14" font-weight="600" letter-spacing="3">HELLO, I'M</text>
    <text x="58" y="122" fill="#E6EDF3" font-size="54" font-weight="700" letter-spacing="-1">Armel Sopgwi</text>
    <text x="60" y="160" fill="#9DA7B3" font-size="20">Full-cycle software engineer. I build, lead and test.</text>
  </g>

  <!-- Role chips -->
  <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">
    <g transform="translate(60 188)">
      <rect width="182" height="36" rx="18" fill="#58A6FF" fill-opacity="0.12" stroke="#58A6FF" stroke-opacity="0.6"/>
      <circle cx="20" cy="18" r="5" fill="#58A6FF"/>
      <text x="34" y="23" fill="#C9E2FF">Build · Developer</text>
    </g>
    <g transform="translate(254 188)">
      <rect width="194" height="36" rx="18" fill="#F2CC60" fill-opacity="0.12" stroke="#F2CC60" stroke-opacity="0.6"/>
      <circle cx="20" cy="18" r="5" fill="#F2CC60"/>
      <text x="34" y="23" fill="#FBE7B0">Lead · Project lead</text>
    </g>
    <g transform="translate(460 188)">
      <rect width="194" height="36" rx="18" fill="#3FB950" fill-opacity="0.12" stroke="#3FB950" stroke-opacity="0.6"/>
      <circle cx="20" cy="18" r="5" fill="#3FB950"/>
      <text x="34" y="23" fill="#B4F0C0">Test · QA engineer</text>
    </g>
  </g>

  <text x="60" y="262" fill="#6E7681" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="2">YAOUNDÉ, CAMEROON  ·  WEB · MOBILE · DESKTOP  ·  FR / EN</text>

  <!-- Delivery pipeline -->
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="2" text-anchor="middle">
    <text x="935" y="92" fill="#7D8590">IDEA → PRODUCTION</text>
    <line x1="770" y1="150" x2="1100" y2="150" stroke="url(#track)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.35"/>
    <line x1="770" y1="150" x2="1100" y2="150" stroke="url(#track)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.95" stroke-dasharray="330" stroke-dashoffset="330">
      <animate attributeName="stroke-dashoffset" values="330;0;0" keyTimes="0;0.8;1" dur="5s" repeatCount="indefinite"/>
    </line>

    <g>
      <circle cx="770" cy="150" r="16" fill="#F2CC60" fill-opacity="0.18">
        <animate attributeName="r" values="22;14;14" keyTimes="0;0.12;1" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="770" cy="150" r="8" fill="#F2CC60"/>
      <text x="770" y="196" fill="#F2CC60">PLAN</text>
    </g>
    <g>
      <circle cx="880" cy="150" r="14" fill="#58A6FF" fill-opacity="0.18">
        <animate attributeName="r" values="14;14;22;14;14" keyTimes="0;0.2;0.27;0.39;1" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="880" cy="150" r="8" fill="#58A6FF"/>
      <text x="880" y="196" fill="#58A6FF">BUILD</text>
    </g>
    <g>
      <circle cx="990" cy="150" r="14" fill="#3FB950" fill-opacity="0.18">
        <animate attributeName="r" values="14;14;22;14;14" keyTimes="0;0.47;0.53;0.65;1" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="990" cy="150" r="8" fill="#3FB950"/>
      <text x="990" y="196" fill="#3FB950">TEST</text>
    </g>
    <g>
      <circle cx="1100" cy="150" r="14" fill="#BC8CFF" fill-opacity="0.18">
        <animate attributeName="r" values="14;14;24;14" keyTimes="0;0.74;0.8;1" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1100" cy="150" r="8" fill="#BC8CFF"/>
      <text x="1100" y="196" fill="#BC8CFF">SHIP</text>
    </g>

    <circle r="6" fill="#FFFFFF" filter="url(#soft)" opacity="0.9">
      <animateMotion path="M770,150 H1100" keyPoints="0;1;1" keyTimes="0;0.8;1" calcMode="linear" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#FFFFFF">
      <animateMotion path="M770,150 H1100" keyPoints="0;1;1" keyTimes="0;0.8;1" calcMode="linear" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
